name: Bug
description: Defect with a reproduction.
type: Bug
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: "What is true when this is done."
    validations:
      required: true
  - type: input
    id: serves
    attributes:
      label: Serves
      description: "Epic criteria advanced, e.g. E2."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "In / out."
    validations:
      required: true
  - type: textarea
    id: touches
    attributes:
      label: Touches
      description: "Expected paths or modules; name hotspots explicitly."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "AC1 ... (observable), one per line."
    validations:
      required: true
  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: "Commands, tests, visual evidence expected."
    validations:
      required: true
  - type: input
    id: risk
    attributes:
      label: Risk
      description: "low | medium | high (rollback plan required if high)."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Files, links, prior decisions."
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: "Steps to reproduce; a failing test comes first."
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual
      description: "What should happen and what happens."
    validations:
      required: true
