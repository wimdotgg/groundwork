name: release-please

on:
  # No push trigger: the merge queue pushes the squash commit to main a few
  # seconds before GitHub marks the PR merged, so a push run races the merge
  # and a push payload carries no changed-file list to guard on (#238). The
  # closed event fires once the PR is merged.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A merged close runs on refs/pull/N/merge, which the `release` environment
  # refuses (#247). This job only dispatches the workflow on main, where the
  # release job below is admitted. Events sent with GITHUB_TOKEN start no run,
  # except workflow_dispatch and repository_dispatch.
  dispatch-on-main:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run release-please.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Skipped until bootstrap sets GROUNDWORK_READY, so a run before the
  # environment exists does not fail on it.
  release-please:
    if: >-
      vars.GROUNDWORK_READY == 'true' &&
      github.event_name == 'workflow_dispatch'
    # On the job, not the workflow, so a close that skips never joins the group.
    # Each closed run's own dispatch queues a real run last either way.
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      # The App token does the writes; it also makes release PRs trigger CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
