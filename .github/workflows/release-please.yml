name: release-please

on:
  push:
    branches: [main]
  # The merge queue pushes the squash commit to main a few seconds before GitHub
  # marks the release PR merged, so the push run cannot see the merge (#238).
  # The closed event fires once the PR is merged; the job `if` below keeps it
  # to merged release-please PRs.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # Skipped until bootstrap sets GROUNDWORK_READY, so the run triggered by
  # template generation does not fail on a missing environment.
  #
  # A release commit is built only by the pull_request run: the push run would
  # open a stray release PR before the merge shows. Other PR closes skip.
  release-please:
    if: >-
      vars.GROUNDWORK_READY == 'true' &&
      (github.event_name != 'push' ||
        !startsWith(github.event.head_commit.message, 'chore(main): release ')) &&
      (github.event_name != 'pull_request' || (
        github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release-please--')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      # The App token does the writes; it also makes release PRs trigger CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
