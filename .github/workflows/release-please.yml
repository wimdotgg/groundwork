name: release-please

on:
  # No push trigger: the merge queue pushes the squash commit to main a few
  # seconds before GitHub marks the PR merged, so a push run races the merge
  # and a push payload carries no changed-file list to guard on (#238). The
  # closed event fires once the PR is merged.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skipped until bootstrap sets GROUNDWORK_READY, so a run before the
  # environment exists does not fail on it.
  #
  # Any merged same-repository PR runs the job, so release PRs are created and
  # updated after ordinary merges; unmerged and fork closes skip.
  release-please:
    if: >-
      vars.GROUNDWORK_READY == 'true' &&
      (github.event_name != 'pull_request' || (
        github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # On the job, not the workflow, on the assumption that a skipped job never
    # joins the group and so cannot replace the pending run that builds a release.
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      # The App token does the writes; it also makes release PRs trigger CI.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
