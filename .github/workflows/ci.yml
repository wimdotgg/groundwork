name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml # zizmor: ignore[self-repository] bootstrap rewrites to <org>/groundwork@vX.Y.Z

  security:
    uses: ./.github/workflows/reusable-security.yml # zizmor: ignore[self-repository] bootstrap rewrites to <org>/groundwork@vX.Y.Z

  # Validators run from the base commit so a PR cannot change the rules it is judged by.
  test-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check test integrity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/test-integrity.mjs

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run script tests
        run: node --test "scripts/**/*.test.mjs"

  settings-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      # Read as data only, never executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Plan settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_ROOT: ${{ github.workspace }}/pr-head
        run: node scripts/ci/settings-plan.mjs

  # Name must stay `Check`: it is the required status check.
  check:
    name: Check
    needs: [verify, security, test-integrity, scripts, settings-plan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Evaluate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs
