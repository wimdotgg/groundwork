name: pr-metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job names are the required status checks. Validators run from the base commit
  # so a PR cannot change the rules it is judged by, and pass through on merge_group.
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate PR metadata
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/pr-metadata.mjs

  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check PR size
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/pr-size.mjs
