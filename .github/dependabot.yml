version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
    ignore:
      # kit-update owns the reusable-workflow SHA pins (spec 8.6).
      - dependency-name: "*/groundwork"
